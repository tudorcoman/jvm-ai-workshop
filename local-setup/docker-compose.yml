version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jvm-ai-workshop-postgres
    environment:
      POSTGRES_DB: aiworkshop
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d aiworkshop"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
