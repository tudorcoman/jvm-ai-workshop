plugins {
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.jetbrains.kotlin.jvm' version '1.9.20'
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.20'
    id 'org.jetbrains.kotlin.plugin.jpa' version '1.9.20'
    id 'java'
}

group = 'com.workshop'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web:3.2.2'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.2.2'
    
    // Kotlin
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    
    // LangChain4j
    implementation 'dev.langchain4j:langchain4j:1.7.1'
    implementation 'dev.langchain4j:langchain4j-open-ai:1.7.1'
    implementation 'dev.langchain4j:langchain4j-embeddings:1.7.1-beta14'
    implementation 'dev.langchain4j:langchain4j-embeddings-all-minilm-l6-v2:1.7.1-beta14'
    
    // Multik - Kotlin multidimensional array library
    implementation 'org.jetbrains.kotlinx:multik-core:0.2.3'
    implementation 'org.jetbrains.kotlinx:multik-default:0.2.3'
    
    // Hibernate & PostgreSQL
    implementation 'org.hibernate.orm:hibernate-core:6.4.4.Final'
    implementation 'org.hibernate:hibernate-vector:6.4.4.Final'
    implementation 'org.postgresql:postgresql:42.7.2'
    implementation 'com.pgvector:pgvector:0.1.4'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
    compilerOptions {
        freeCompilerArgs.add('-Xjsr305=strict')
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
